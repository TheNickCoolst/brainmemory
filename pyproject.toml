[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmemory"
version = "0.1.0"
description = "Biologically inspired experimental memory system based on sparse neural ensembles and synaptic plasticity."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BrainMemory contributors"}]
keywords = ["memory", "neuroscience", "hebbian", "stdp", "engram", "sparse-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["brainmemory*"]

[tool.setuptools.package-data]
brainmemory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that run larger networks",
]

[tool.ruff]
line-length = 100
target-version = "py310"
